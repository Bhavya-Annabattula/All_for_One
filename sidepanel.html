<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #1e1e2e;
      color: #eee;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .header {
      padding: 14px;
      border-bottom: 1px solid #2a2a3d;
    }
    .header h2 {
      margin: 0;
      font-size: 16px;
    }
    #chatLog {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      max-width: 85%;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #4f46e5;
    }
    .msg.bot {
      align-self: flex-start;
      background: #2a2a3d;
    }
    .inputBar {
      display: flex;
      padding: 10px;
      gap: 8px;
      border-top: 1px solid #2a2a3d;
    }
    #questionInput {
      flex: 1;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #3a3a4d;
      background: #2a2a3d;
      color: #eee;
      font-size: 13px;
    }
    #askBtn {
      padding: 8px 14px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>Page Assistant</h2>
  </div>
  <div id="chatLog"></div>
  <div class="inputBar">
    <input type="text" id="questionInput" placeholder="Ask about this page..." />
    <button id="askBtn">Send</button>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
