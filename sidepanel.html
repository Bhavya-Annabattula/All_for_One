<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0d0d16;
      color: #f1f1f8;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .header {
      padding: 20px 20px 18px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: "";
      position: absolute;
      top: -60%;
      right: -20%;
      width: 220px;
      height: 220px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
    }

    .header::after {
      content: "";
      position: absolute;
      bottom: -80%;
      left: -10%;
      width: 160px;
      height: 160px;
      background: rgba(255,255,255,0.06);
      border-radius: 50%;
    }

    .header-row {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 1;
    }

    .header-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(255,255,255,0.18);
      border: 1.5px solid rgba(255,255,255,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .header h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: white;
    }

    .header .subtitle {
      margin: 2px 0 0;
      font-size: 11.5px;
      color: rgba(255,255,255,0.85);
      font-weight: 600;
    }

    #chatLog {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .empty-state {
      margin-top: 30px;
      text-align: center;
      padding: 0 10px;
    }

    .empty-state .big-emoji {
      font-size: 46px;
      display: block;
      margin-bottom: 10px;
      filter: drop-shadow(0 4px 12px rgba(124,58,237,0.4));
    }

    .empty-state .headline {
      font-size: 16px;
      font-weight: 800;
      color: #f1f1f8;
      margin: 0 0 6px;
    }

    .empty-state .sub {
      font-size: 12.5px;
      color: #8a8aa3;
      line-height: 1.6;
      margin: 0;
    }

    .suggestion-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 16px;
    }

    .suggestion-chip {
      background: rgba(124,58,237,0.15);
      border: 1.5px solid rgba(124,58,237,0.4);
      color: #c4b5fd;
      font-size: 11.5px;
      font-weight: 700;
      padding: 7px 13px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .suggestion-chip:hover {
      background: rgba(124,58,237,0.28);
      transform: translateY(-1px);
    }

    .msg {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.55;
      max-width: 88%;
      white-space: pre-wrap;
      word-break: break-word;
      animation: pop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-weight: 500;
    }

    @keyframes pop {
      from { opacity: 0; transform: translateY(8px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border-bottom-right-radius: 5px;
      color: white;
      box-shadow: 0 4px 14px rgba(79,70,229,0.35);
    }

    .msg.bot {
      align-self: flex-start;
      background: #1a1a2b;
      border: 1.5px solid #2e2e47;
      border-bottom-left-radius: 5px;
    }

    .msg.bot.thinking {
      color: #a5a5c0;
      font-style: italic;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot-pulse {
      display: inline-flex;
      gap: 3px;
    }

    .dot-pulse span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #7c3aed;
      animation: bounce 1s infinite ease-in-out;
    }

    .dot-pulse span:nth-child(2) { animation-delay: 0.15s; }
    .dot-pulse span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }

    .msg.bot.error {
      background: rgba(239, 68, 68, 0.14);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      font-weight: 600;
    }

    .inputBar {
      display: flex;
      padding: 14px;
      gap: 10px;
      background: #12121e;
      border-top: 2px solid #262640;
    }

    #questionInput {
      flex: 1;
      padding: 13px 16px;
      border-radius: 24px;
      border: 2px solid #2e2e47;
      background: #1a1a2b;
      color: #f1f1f8;
      font-size: 14px;
      font-weight: 500;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    #questionInput:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124,58,237,0.2);
    }

    #questionInput::placeholder {
      color: #6b6b85;
      font-weight: 500;
    }

    #askBtn {
      padding: 13px 22px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.2px;
      transition: transform 0.1s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 14px rgba(124,58,237,0.4);
    }

    #askBtn:hover {
      box-shadow: 0 6px 18px rgba(124,58,237,0.55);
    }

    #askBtn:active {
      transform: scale(0.94);
    }

    #askBtn:disabled {
      opacity: 0.5;
      cursor: default;
      box-shadow: none;
    }

    #chatLog::-webkit-scrollbar {
      width: 7px;
    }
    #chatLog::-webkit-scrollbar-thumb {
      background: #2e2e47;
      border-radius: 4px;
    }
    #chatLog::-webkit-scrollbar-thumb:hover {
      background: #3d3d5c;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-row">
      <div class="header-icon">🐾</div>
      <div>
        <h2>Page assistant</h2>
        <p class="subtitle">Reads this page. Answers anything.</p>
      </div>
    </div>
  </div>
  <div id="chatLog">
    <div class="empty-state" id="emptyState">
      <span class="big-emoji">✨</span>
      <p class="headline">Ask me about this page</p>
      <p class="sub">I read what's on screen and answer from it directly.</p>
      <div class="suggestion-row">
        <button class="suggestion-chip" data-q="Summarize this page">Summarize this page</button>
        <button class="suggestion-chip" data-q="What are the key points?">Key points</button>
        <button class="suggestion-chip" data-q="Is there anything I should be cautious about?">Anything risky?</button>
      </div>
    </div>
  </div>
  <div class="inputBar">
    <input type="text" id="questionInput" placeholder="Ask about this page..." />
    <button id="askBtn">Send</button>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
