<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap');
    body {
      width: 340px;
      padding: 16px;
      font-family: system-ui, sans-serif;
      background: #1e1e2e;
      color: #eee;
    }
    h2 {
      margin: 0 0 4px 0;
      font-size: 17px;
    }
    .subtitle {
      font-size: 11px;
      color: #999;
      margin-bottom: 16px;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border-radius: 8px;
      background: #2a2a3d;
      margin-bottom: 16px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #888;
      flex-shrink: 0;
    }
    .status-dot.safe { background: #22c55e; }
    .status-dot.warning { background: #eab308; }
    .status-text {
      font-size: 12px;
    }
    .status-text .site-url {
      display: block;
      font-size: 10px;
      color: #999;
      margin-top: 2px;
      word-break: break-all;
    }

    /* Circular icon row */
    .icon-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
    }
    .icon-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      cursor: pointer;
      color: #ddd;
    }
    .icon-circle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid #3a3a4d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      text-align: center;
      transition: all 0.15s ease;
      background: #2a2a3d;
    }
    .icon-btn:hover .icon-circle {
      border-color: #4f46e5;
    }
    .icon-btn.active .icon-circle {
      background: #4f46e5;
      border-color: #4f46e5;
      color: white;
    }
    .icon-label {
      font-size: 10px;
      text-align: center;
    }

    /* Security full-width bar */
    .security-btn {
      width: 100%;
      padding: 10px;
      background: #2a2a3d;
      border: 2px solid #3a3a4d;
      border-radius: 20px;
      color: #ddd;
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .security-btn:hover {
      border-color: #4f46e5;
    }
    .security-btn.active {
      background: #4f46e5;
      border-color: #4f46e5;
      color: white;
    }

    .panel {
      display: none;
    }
    .panel.active {
      display: block;
    }

    #xrayResult, #securityResult {
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      min-height: 140px;
      max-height: 240px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 8px;
    }
    button.action-btn {
      width: 100%;
      padding: 9px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    button.action-btn:hover {
      background: #4338ca;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 20px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #444;
      transition: .2s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #4f46e5;
    }
    input:checked + .slider:before {
      transform: translateX(18px);
    }
    .avatar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }
    .avatar-note {
      font-size: 11px;
      color: #999;
      margin-top: 4px;
    }
  </style>
  <style>
  /* ---------- Shared scan-result container ---------- */
  #xrayResult, #securityResult {
    background: linear-gradient(180deg, #23233a 0%, #1c1c2e 100%);
    border: 1px solid #33334a;
    position: relative;
    overflow-x: hidden;
  }

  #xrayResult::before, #securityResult::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #4f46e5, transparent);
    opacity: 0.6;
  }

  .scan-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 24px 10px;
    color: #666;
    font-size: 12px;
    text-align: center;
  }
  .scan-empty .scan-empty-icon {
    font-size: 20px;
    opacity: 0.5;
  }

  .scan-loading {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #a5b4fc;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
  }
  .scan-loading .dot-pulse {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #4f46e5;
    animation: dotPulse 1s infinite ease-in-out;
  }
  @keyframes dotPulse {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.1); }
  }

  /* ---------- Tech X-ray: category groups ---------- */
  .xray-category {
    margin-bottom: 14px;
    animation: slideIn 0.35s ease backwards;
  }
  .xray-category:last-child { margin-bottom: 2px; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-6px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .xray-category-header {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
    margin-bottom: 6px;
    font-family: 'JetBrains Mono', monospace;
  }
  .xray-category-header .cat-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    box-shadow: 0 0 6px currentColor;
  }
  .xray-category-header .cat-count {
    margin-left: auto;
    opacity: 0.5;
    font-weight: 400;
  }

  .xray-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    margin-bottom: 4px;
    background: #262640;
    border: 1px solid #34344f;
    border-left: 3px solid var(--chip-color, #4f46e5);
    border-radius: 6px;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .xray-chip:hover {
    transform: translateX(2px);
    border-left-color: var(--chip-color, #4f46e5);
    background: #2a2a48;
  }
  .xray-chip .chip-name {
    font-size: 12.5px;
    font-weight: 500;
    color: #eee;
    font-family: 'JetBrains Mono', monospace;
  }
  .xray-chip .chip-evidence {
    font-size: 10px;
    color: #777;
    margin-left: auto;
    text-align: right;
    max-width: 130px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .xray-summary-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    background: #1a1a2c;
    border-radius: 6px;
    margin-bottom: 12px;
    font-size: 11px;
    color: #999;
    font-family: 'JetBrains Mono', monospace;
  }
  .xray-summary-bar strong {
    color: #a5b4fc;
    font-size: 15px;
  }

  /* ---------- Security: verdict banner ---------- */
  .sec-verdict-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 12px;
    background: color-mix(in srgb, var(--verdict-color, #22c55e) 12%, #1e1e2e);
    border: 1px solid color-mix(in srgb, var(--verdict-color, #22c55e) 35%, transparent);
  }
  .sec-verdict-icon {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    background: color-mix(in srgb, var(--verdict-color, #22c55e) 25%, transparent);
    box-shadow: 0 0 12px color-mix(in srgb, var(--verdict-color, #22c55e) 40%, transparent);
  }
  .sec-verdict-text strong {
    color: var(--verdict-color, #22c55e);
    font-size: 13.5px;
    display: block;
  }
  .sec-verdict-text p {
    font-size: 11px;
    color: #bbb;
    margin: 3px 0 0;
    line-height: 1.4;
  }

  .sec-score-row {
    margin-bottom: 8px;
  }
  .sec-score-label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #999;
    margin-bottom: 3px;
    font-family: 'JetBrains Mono', monospace;
  }
  .sec-score-track {
    height: 6px;
    background: #16161f;
    border-radius: 99px;
    overflow: hidden;
  }
  .sec-score-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 0.5s ease;
    background: linear-gradient(90deg, var(--fill-start), var(--fill-end));
  }

  .sec-findings {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed #34344f;
  }
  .sec-finding-row {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    font-size: 11.5px;
    margin-bottom: 6px;
    color: #ccc;
    line-height: 1.4;
  }
  .sec-finding-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    margin-top: 3px;
    flex-shrink: 0;
    box-shadow: 0 0 5px currentColor;
  }
  </style>
</head>
<body>
  <h2>All for One</h2>
  <div class="subtitle">Security check - Tech detector - Page-aware AI chat</div>

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <div class="status-text">
      <span id="statusLabel">Checking site...</span>
      <span class="site-url" id="siteUrl"></span>
    </div>
  </div>

  <div class="icon-row">
    <button class="icon-btn" id="chatbotBtn">
      <div class="icon-circle">AI CHAT</div>
      <div class="icon-label">AI Chatbot</div>
    </button>
    <button class="icon-btn" id="assistanceBtn" data-panel="avatar">
      <div class="icon-circle">BUDDY</div>
      <div class="icon-label">AI Assistance</div>
    </button>
    <button class="icon-btn active" id="xrayIconBtn" data-panel="xray">
      <div class="icon-circle">X-RAY</div>
      <div class="icon-label">Tech Xray</div>
    </button>
  </div>

  <button class="security-btn" id="securityIconBtn" data-panel="security">Security</button>

  <div class="panel active" id="xray">
    <div id="xrayResult"><div class="scan-empty"><div class="scan-empty-icon">◌</div><div>Click "Run Tech X-ray" to scan this site.</div></div></div>
    <button class="action-btn" id="xrayBtn">Run Tech X-ray</button>
  </div>

  <div class="panel" id="security">
    <div id="securityResult"><div class="scan-empty"><div class="scan-empty-icon">◌</div><div>Click "Check Site Safety" to scan this site.</div></div></div>
    <button class="action-btn" id="securityBtn">Check Site Safety</button>
  </div>

  <div class="panel" id="avatar">
    <div class="avatar-row">
      <span>Show floating AI buddy on page</span>
      <label class="switch">
        <input type="checkbox" id="avatarToggle">
        <span class="slider"></span>
      </label>
    </div>
    <div class="avatar-note">
      The buddy follows your cursor and reacts when clicked. Click it anytime to open the chatbot.
    </div>
  </div>
<script src="techdetect.js"></script>
  <script src="popup.js"></script>
</body>
</html>
